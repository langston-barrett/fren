name: pr-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Secrets aren't available to PRs from forks.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The report, in the step summary, shows the tools used and denied.
          # The repository is private and the input is its own PRs.
          display_report: "true"
          # Logs the whole conversation, to find what is denied when a review
          # posts nothing. The repository is private and the reviewer has no
          # secrets in reach; remove once reviews post reliably.
          show_full_output: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on correctness bugs, edge cases,
            and clarity; skip nitpicks that linters already catch. Fren's
            requirements are in src/Reqs; check that changes to behaviour
            are specified there first, and that the code and its
            requirements agree.

            Do the review yourself, in this session: don't delegate it to
            agents or subagents. The run ends when you stop, so anything
            left running in the background is lost and nothing is posted.

            Use `gh pr comment` to post a single summary comment with your
            findings, and inline comments for specific issues. Read the
            changed files in the checkout with Read, Grep and Glob, rather
            than piping `gh pr diff`. Write the summary with Write to
            `review.md` in the current directory (Write is denied outside
            it, such as in /tmp), then post it with
            `gh pr comment <number> --body-file review.md`: a command
            substitution such as `--body "$(cat ...)"` is denied.
            If you cannot complete the review, still post a summary comment
            saying why, so that a review never ends without a trace.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,Write"
            --disallowedTools "Agent,Task"
