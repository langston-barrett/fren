name: pre-merge
# Each pull request's head, merged into `main` as GitHub merges it, built
# with `--wfail` and tested, but for the slowest tests, the mutants of
# Fren's own requirements, which the `lean ci` workflow checks on `main`
# (`Reqs/dev/Testing#continuous-integration`). Each job starts from the
# `.lake` of `main`'s last build, so that it rebuilds only what the pull
# request changes. Its last job, `pre-merge`, passes only if all the others
# did: it is the status to rely on, and the one the merge queue requires.
#
# On a pull request, it also uploads the binaries it built, `fren` from the
# build and `fren_test` from shard 0, as the artifacts `fren-SHA` and
# `fren_test-SHA`, where SHA is the pull request's head, kept for 3 days:
# Linux binaries of the head merged into `main`, with which a reviewer can
# probe the head without building it (`Reqs/dev/Testing#continuous-integration`).
#
# It runs on each push to a pull request, and again in the merge queue, on
# the queue's merge commit of the pull request into the current `main`
# (behind any pull requests ahead of it in the queue). Either way, the
# checkout's `HEAD^1` is the commit it merges into. There is no manual
# trigger: run by hand, it would check out a branch alone, whose `HEAD^1`
# is the branch's own parent, and its status would say nothing about the
# branch merged into `main`.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build --wfail
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    # The parent of the merge commit, too: it is `main`'s commit, or, in
    # the merge queue, the commit of the pull request ahead in the queue,
    # whose `.lake` was never saved, so that the cache falls back to the
    # latest one saved on `main`.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 2
    - id: base
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/lake
      with:
        sha: ${{ steps.base.outputs.sha }}
    # The library, the regression tests, Fren's own requirements, the links
    # from Fren's code to them, the examples and the binaries; warnings,
    # including inconclusive checks and untraced requirements, fail it.
    - run: lake build --wfail
    # Only once the build has passed: until then, the `.lake` may still hold
    # the `fren` of `main` that it was restored with.
    - if: ${{ github.event_name == 'pull_request' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fren-${{ github.event.pull_request.head.sha }}
        path: .lake/build/bin/fren
        if-no-files-found: error
        retention-days: 3
  test:
    name: lake test (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 2
    - id: base
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/lake
      with:
        sha: ${{ steps.base.outputs.sha }}
    # Only the test driver, and what it imports, not `Reqs`: the tests run
    # the binary's code in the driver's process, and import `Fren`. Shard 0
    # checks Fren's own requirements with the binary, the slowest job, and
    # the others the rest (`Reqs/dev/Testing`).
    - run: lake build fren_test
    # Before the tests run, so that a reviewer can probe a head whose tests
    # fail.
    - if: ${{ github.event_name == 'pull_request' && matrix.shard == 0 }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fren_test-${{ github.event.pull_request.head.sha }}
        path: .lake/build/bin/fren_test
        if-no-files-found: error
        retention-days: 3
    - run: lake test -- --skip-own-mutants --timings --shard "$SHARD/4"
      env:
        SHARD: ${{ matrix.shard }}
  pre-merge:
    needs: [build, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - run: test "$BUILD" = success && test "$TEST" = success
      env:
        BUILD: ${{ needs.build.result }}
        TEST: ${{ needs.test.result }}
