name: pre-merge
# Third stage: pre-approval -> pr-review -> pre-merge. The checked,
# posted-review attestation is from the trusted post job, not PR code.
# workflow_run uses main's workflow/scripts. Preparation only reads PR
# objects; the reusable test jobs have no secrets or write permissions.
on:
  # zizmor: ignore[dangerous-triggers] no secrets reach PR code; only the
  # separate trusted reporting jobs can write a status on the head.
  workflow_run:
    workflows: [pr-review]
    types: [completed]
  # Local blocking rereviews must revoke already completed gates too. This
  # trigger only invalidates; it never starts tests from comment text.
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      review-run:
        description: Completed main-context pr-review run that posted the checked verdict
        required: false
        type: string
        default: ""
      pr:
        description: PR with a local or inherited review (coordinator confirms the skip first)
        required: false
        type: number
        default: 0

permissions: {}

# Serialize reruns of a review; different heads have separate statuses.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || inputs.review-run || inputs.pr || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.prepare.outputs.head }}
      pr: ${{ steps.prepare.outputs.pr }}
      merge: ${{ steps.prepare.outputs.merge }}
      base: ${{ steps.prepare.outputs.base }}
      relevant: ${{ steps.prepare.outputs.relevant }}
      revoked: ${{ steps.prepare.outputs.revoked }}
      own-spec-agreement: ${{ steps.prepare.outputs.own-spec-agreement }}
      methods-agree: ${{ steps.prepare.outputs.methods-agree }}
      coverage: ${{ steps.prepare.outputs.coverage }}
      fuzz-frontends: ${{ steps.prepare.outputs.fuzz-frontends }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: prepare
      run: python3 -I .github/pre-merge/gate.py prepare
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEW_RUN: ${{ github.event.workflow_run.id || inputs.review-run }}
        PR_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || '' }}
  pending:
    needs: prepare
    if: ${{ needs.prepare.outputs.head != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    outputs:
      check: ${{ steps.pending.outputs.check }}
    steps:
    - id: pending
      name: Mark the head pending before tests start
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD: ${{ needs.prepare.outputs.head }}
        URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        check=$(gh api "repos/$REPO/check-runs" -f name=pre-merge -f head_sha="$HEAD" \
          -f status=in_progress -f details_url="$URL" --jq .id)
        echo "check=$check" >> "$GITHUB_OUTPUT"
  slow:
    needs: [prepare, pending]
    if: ${{ needs.prepare.outputs.relevant == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/slow-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.merge }}
      cache-sha: ${{ needs.prepare.outputs.base }}
      concurrency-key: ${{ needs.prepare.outputs.head }}
      own-spec-agreement: ${{ needs.prepare.outputs.own-spec-agreement == 'true' }}
      methods-agree: ${{ needs.prepare.outputs.methods-agree == 'true' }}
      coverage: ${{ needs.prepare.outputs.coverage == 'true' }}
      fuzz-frontends: ${{ needs.prepare.outputs.fuzz-frontends == 'true' }}
  report:
    needs: [prepare, pending, slow]
    if: ${{ always() && needs.prepare.outputs.head != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
        sparse-checkout: |
          .github/pre-merge
          .github/pr-review
    - run: python3 -I .github/pre-merge/gate.py finish
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS: ${{ toJSON(needs) }}
        CHECK_RUN_ID: ${{ needs.pending.outputs.check }}
        REVIEW_RUN: ${{ github.event.workflow_run.id || inputs.review-run }}
        PR_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || '' }}
