name: lint
# `lun run --check`, and the tests of the scripts, on `main` and on each
# pull request: its `lint` status gates merges, like `pre-approval`'s. Two
# pull requests that each pass can still fail together, for example two
# imports added out of order to one sorted block, and `main`'s own run is
# what catches that. It keeps a `merge_group` trigger, as `pre-approval` does,
# for a merge queue, which this repository doesn't use.
on:
  push:
    branches:
    - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Among them, the pr-review workflow's decisions (`.github/pr-review`).
    - name: Test the scripts
      run: |
        set -euo pipefail
        python3 -I -B scripts/heavy_test.py
        python3 -I -B scripts/lake_cache.py test
        python3 -I -B scripts/rules_report.py test
        # Keep each protocol/worker suite within its per-invocation budget,
        # including every current and future discovered test file.
        for suite in .github/pre-merge/test_*.py; do
          python3 -I -B -m unittest discover -s .github/pre-merge -p "${suite##*/}"
        done
        python3 -I -B -m unittest discover -s .github/codex-agent
        # pr-review's, with the CommonMark parser that test_frame.py needs.
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps \
          -r .github/pr-review/requirements-test.txt
        "$RUNNER_TEMP/venv/bin/python" -I -B -m unittest discover -s .github/pr-review
    # That pr-review's probe container lets a hostile binary affect nothing
    # but its own output.
    - name: Test pr-review's sandbox
      run: bash .github/pr-review/test_sandbox.sh
    - name: Test codex-agent's sandbox
      run: bash .github/codex-agent/test_sandbox.sh
    - name: Test the slow workers' sandbox
      run: bash .github/pre-merge/test_sandbox.sh
    - name: Test Codex review's tools and sandbox
      run: bash .github/pr-review/test_codex_sandbox.sh
    - uses: langston-barrett/gha/.github/actions/install-linters@d0cdf249a9684185d96083c87d078679cd373b28
    - name: Install keep-sorted
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        install_dir="${HOME}/.local/bin"
        mkdir -p "${install_dir}"
        echo "${install_dir}" >> "${GITHUB_PATH}"
        curl \
          --fail \
          --location \
          --proto '=https' \
          --retry 1 \
          --retry-delay 3 \
          --show-error \
          --silent \
          --tlsv1.2 \
          --output "${install_dir}/keep-sorted" \
          https://github.com/google/keep-sorted/releases/download/v0.10.0/keep-sorted_linux_amd64
        echo "079710c01619cc3dc11c9ddce18ac8db8d86701e7d12f9c5b62b8c4c4a664cca  ${install_dir}/keep-sorted" | sha256sum --check
        chmod +x "${install_dir}/keep-sorted"
    # The verdict of `pre-approval`, on every combination of its jobs' results.
    - name: Test pre-approval's verdict
      run: python3 -I -B scripts/pre_approval_verdict.py test
    - uses: langston-barrett/lun/.github/actions/lun@aff233f8a5cf4c72a8332941af8d6e56719aba78
      with:
        run-flags: "--check"
