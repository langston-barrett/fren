name: pr-review-trial
# Temporary: runs this branch's pr-review on #666 (a full review) and #660
# (a "fixes only" check), posting nothing, since the disabled pr-review
# cannot be run by hand. Removed before review.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr-review-trial.yml]

permissions: {}

jobs:
  full:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pr: 666
      post: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  light:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pr: 660
      post: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
