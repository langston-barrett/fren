name: pr-review-trial
# Temporary: runs this branch's pr-review on #660's last head, which had a
# "fixes only" check, posting nothing, since the disabled pr-review cannot
# be run by hand. Removed before review.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr-review-trial.yml]

permissions: {}

jobs:
  light:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pr: 660
      post: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
