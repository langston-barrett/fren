name: pr-review-trial
# Temporary: runs this branch's pr-review on #666, posting nothing, since
# the disabled pr-review cannot be run by hand. Removed before review.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr-review-trial.yml]

permissions: {}

jobs:
  trial:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pr: 666
      post: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
