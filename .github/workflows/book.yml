name: book
# Builds the reference manual (`book.toml`) with mdBook and mdbook-spec, which
# renders rule identifiers as anchors (`Reqs/dev/Style#rule-identifiers`), and
# fails if the build does. It publishes nothing. The page of the rules and
# their requirements is written by the test driver that the calling workflow
# built in the same run and uploaded as the artifact `artifact`
# (`scripts/rules_report.py`), so that this job builds no Lean: `pre-merge`
# calls it on each pull request, and `lean ci` on each push to `main`.
#
# Where the caller's run has no such artifact, because the job that uploads
# it was cancelled or failed before it did, it builds nothing, says so, and
# passes, with the output `built` false, so that the caller's failure is
# the one reported. It has no `concurrency` of its own: a called workflow's
# group would be named after its caller and take the caller's own group.
on:
  workflow_call:
    inputs:
      artifact:
        description: The artifact that holds the test driver, `fren_test`.
        type: string
        required: true
    outputs:
      built:
        description: Whether the book was built, `true` or `false`.
        value: ${{ jobs.book.outputs.built }}

permissions:
  contents: read

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
  # The commit of rust-lang/reference whose `tools/mdbook-spec` is installed.
  MDBOOK_SPEC_REV: 3989fe91f1a601b51684a582ad17b2503f221787

jobs:
  book:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      built: ${{ steps.driver.outcome == 'success' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The stripped test driver of the caller's run, which links only to the
    # system's libraries, so it runs here without Lean.
    - id: driver
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/fren_test
    - if: ${{ steps.driver.outcome != 'success' }}
      run: echo "::notice title=book::no test driver in this run, so the book is not built; the job that uploads it was cancelled or failed first"
    # An artifact keeps no executable bit.
    - if: ${{ steps.driver.outcome == 'success' }}
      run: chmod +x "$RUNNER_TEMP/fren_test/fren_test"
    - name: Install mdBook
      if: ${{ steps.driver.outcome == 'success' }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        install_dir="${HOME}/.local/bin"
        mkdir -p "${install_dir}"
        echo "${install_dir}" >> "${GITHUB_PATH}"
        curl \
          --fail \
          --location \
          --proto '=https' \
          --retry 1 \
          --retry-delay 3 \
          --show-error \
          --silent \
          --tlsv1.2 \
          --output mdbook.tar.gz \
          "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check
        tar -xzf mdbook.tar.gz -C "${install_dir}"
        rm mdbook.tar.gz
    # mdbook-spec reads the Reference's own `src`, for its grammar, at the
    # path where `cargo install` checked it out (`env!("CARGO_MANIFEST_DIR")`
    # in its `tools/grammar`), so the cache holds that checkout with the
    # binary: with the binary alone, it panics on a cache hit.
    - name: Restore mdbook-spec
      if: ${{ steps.driver.outcome == 'success' }}
      id: spec-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo-mdbook-spec
          ~/.cargo/git/checkouts
        key: mdbook-spec-${{ env.MDBOOK_SPEC_REV }}-checkout
    - name: Install mdbook-spec
      if: steps.driver.outcome == 'success' && steps.spec-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        cargo install --locked --root "${HOME}/.cargo-mdbook-spec" \
          --git https://github.com/rust-lang/reference --rev "${MDBOOK_SPEC_REV}" mdbook-spec
    - name: Save mdbook-spec
      if: steps.driver.outcome == 'success' && steps.spec-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo-mdbook-spec
          ~/.cargo/git/checkouts
        key: mdbook-spec-${{ env.MDBOOK_SPEC_REV }}-checkout
    # mdbook-spec only warns about a rule defined twice, a bad admonition or
    # a link that it cannot resolve. Its `SPEC_DENY_WARNINGS` needs a Rust
    # checkout (`SPEC_RUST_ROOT`), so the job fails on its summary line
    # instead.
    - name: Build the book
      if: ${{ steps.driver.outcome == 'success' }}
      env:
        FREN_TEST: ${{ runner.temp }}/fren_test/fren_test
      run: |
        set -euo pipefail
        export PATH="${HOME}/.cargo-mdbook-spec/bin:${PATH}"
        mdbook build 2>&1 | tee "${RUNNER_TEMP}/book.log"
        if grep -q '^mdbook-spec generated' "${RUNNER_TEMP}/book.log"; then
          echo "::error::mdbook-spec reported warnings"
          exit 1
        fi
