name: lean ci
# On `main`, everything: `lake build --wfail`, the whole `lake test`, a
# sample of the mutants of Fren's own requirements, their checks in Lean,
# compared with the binary's, the coverage, and the book, with the test
# driver that shard 0 uploads as `fren_test-SHA` (`book.yml`). It
# saves `main`'s `.lake`, from which each pull request's `pre-approval`
# workflow starts (`Reqs/dev/Testing#continuous-integration`).
on:
  push:
    branches:
    - main
  # A run by hand, on any branch, may fuzz alone, and more seeds, to try a
  # change to the fuzzer or to its known kinds.
  workflow_dispatch:
    inputs:
      fuzz-only:
        description: Run only the fuzz-frontends job
        type: boolean
        default: false
      fuzz-count:
        description: Seeds for each of fuzz-frontends' four fuzzers
        type: number
        default: 150

permissions:
  contents: read

# Stopgap until #834 bounds enumeration and evaluation recursion. Lean runs
# native executables on threads whose explicit stacks ignore `ulimit -s`.
# Reserve 8 GiB per stack; physical memory is committed only as used.
env:
  LEAN_STACK_SIZE_KB: "8388608"

# Each job of a push to `main` waits for the same job of the run before it,
# rather than cancelling it: of pushes in quick succession, none cancels a
# running job and the latest saves a `.lake`, though GitHub cancels a job
# that is still pending when a later one of its group is queued, so that a
# run in between may be cancelled, in part or whole. So shard 0 still
# compares with the query cache that the previous shard 0 saved. No job
# waits for the whole run before it, so the build job saves the `.lake`
# from which pull requests start as soon as it has built, rather than once
# the slowest job of the run before it has finished
# (`Reqs/dev/Testing#continuous-integration`).
jobs:
  build:
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      id: lake
      with:
        sha: ${{ github.sha }}
    # `lake build` builds the library, the regression tests (`FrenTest`, which
    # check their own output with `#guard_msgs`), Fren's own requirements
    # (`Reqs`, only elaborated: `lake test`'s `ownSpec` checks them with the
    # binary, and the `own-spec-agreement` job below in Lean), the links from
    # Fren's code to them (`Impls`, whose `#fren_trace` warns about any
    # requirement without evidence), the example specs' Lean implementations
    # (`Examples`) and the `fren` binary; warnings, including
    # inconclusive checks and untraced requirements, fail it.
    - id: build
      run: touch "$RUNNER_TEMP/build-start" && lake build --wfail
    # The test driver too, as `lake test` builds it, not a default target:
    # it links the C code of `Fren` and `FrenTest`, of which the default
    # targets link only `Fren.Seq` (through `fren`), so that without it the
    # `.lake` saved below has the object files of none of their other
    # modules, and every test shard of every pull request compiles them all
    # again. Lake recompiles a module's C code only if the code differs, so
    # a shard that starts from this `.lake` compiles only what its pull
    # request changes (`Reqs/dev/Testing#continuous-integration`).
    - id: driver
      run: lake build --wfail fren_test
    # As soon as it is built, for the pull requests that start from it. Lake
    # saves no output of a module that failed, so a failed build's `.lake`
    # would serve as well, but a pull request that restores it would
    # rebuild the modules that failed.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: >-
        ${{ steps.build.outcome == 'success' &&
        steps.driver.outcome == 'success' &&
        steps.lake.outputs.cache-hit != 'true' }}
      with:
        path: .lake
        key: ${{ steps.lake.outputs.key }}
    # No output that the build wrote names the checkout's directory, as in
    # `pre-approval` (`Reqs/dev/Testing#shared-builds`). Like the mutation
    # sample below, it runs even if only the test driver failed to build.
    - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: python3 scripts/relocatable.py --since "$RUNNER_TEMP/build-start"
    # A few mutants of Fren's own requirements on each push, a different few
    # each run (the seed is the run's number), so that over many pushes the
    # runs cover them: all of them, over 3000, are too many for one run.
    # Survivors are warnings, and the step never fails the build, since the
    # survivors are not triaged yet.
    - name: Mutate a few requirements
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      continue-on-error: true
      timeout-minutes: 2
      env:
        SEED: ${{ github.run_number }}
      run: |
        set -euo pipefail
        # Fren's own requirements, in the order in which `lake test` checks
        # them (`ownSpecFiles`).
        mapfile -t files < <(sed -n '/^def ownSpecFiles/,/map fun r/p' src/FrenTestMain.lean \
          | grep -o '"[A-Za-z/]*"' | tr -d '"' | sed 's|.*|src/Reqs/&.md|')
        test "${#files[@]}" -gt 0
        if .lake/build/bin/fren mutate --sample 5 --seed "$SEED" --timeout 5 "${files[@]}"; then code=0; else code=$?; fi
        case $code in
          0) ;;
          3) echo "::warning title=fren mutate::some mutants survived (seed $SEED); see the step's log" ;;
          # Shown as an error, and as the step's outcome, though
          # `continue-on-error` keeps the build passing.
          1) echo "::error title=fren mutate::an internal error (seed $SEED); see the step's log"; exit 1 ;;
          *) echo "::error title=fren mutate::could not run (exit $code); see the step's log"; exit "$code" ;;
        esac
  # Once the build has saved its `.lake`, deletes all but the newest three
  # that `main` saved. Each is about 470 MB, and the repository's caches
  # share 10 GB, past which GitHub evicts the least recently used, so that
  # without this the old `.lake`s, which only a pull request based on an
  # old commit of `main` would restore, push out the small caches, such as
  # the query cache and mdbook's. A pull request whose base's `.lake` was
  # deleted restores the newest, and Lake rebuilds what differs. Its own
  # job, since it alone has `actions: write`, with which it may delete the
  # repository's caches, and it runs no code from the checkout.
  prune-lake-caches:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    concurrency:
      group: ${{ github.workflow }}-prune-lake-caches
      cancel-in-progress: false
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mapfile -t old < <(gh cache list --ref refs/heads/main --key lake- \
          --sort created_at --order desc --limit 100 \
          --json id --jq '.[3:][].id')
        for id in "${old[@]}"; do
          gh cache delete "$id"
        done
        echo "deleted ${#old[@]} old .lake caches"
        gh cache list --ref refs/heads/main --key lake- \
          --sort created_at --order desc --json key,createdAt,sizeInBytes
  # The whole of `lake test`, the mutants of Fren's own requirements too,
  # split over machines: shard 0 checks Fren's own requirements with the
  # binary, and the others the rest (`Reqs/dev/Testing`).
  test:
    name: lake test (shard ${{ matrix.shard }} of 5)
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake build --wfail fren_test
    # The test driver, stripped, from which `book` writes the page of the
    # rules (`book.yml`).
    - if: ${{ matrix.shard == 0 }}
      run: |
        mkdir "$RUNNER_TEMP/artifact"
        cp .lake/build/bin/fren_test "$RUNNER_TEMP/artifact/fren_test"
        # Lake's artifact cache links its outputs read-only, so the copy is
        # too (`Reqs/dev/Testing#shared-builds`).
        chmod u+w "$RUNNER_TEMP/artifact/fren_test"
        strip "$RUNNER_TEMP/artifact/fren_test"
    - if: ${{ matrix.shard == 0 }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fren_test-${{ github.sha }}
        path: ${{ runner.temp }}/artifact
        if-no-files-found: error
        retention-days: 3
        overwrite: true
    # Shard 0 asks every query of Fren's own requirements of the solver,
    # with an empty query cache, and compares each answer with the one that
    # the previous `main`'s run kept: a contradiction fails it, and so does
    # comparing no answers, unless the previous cache has no entry of this
    # `queryCacheVersion` and cvc5 (as after a change that alters every
    # key). It then saves exactly the answers of this run, from which pull
    # requests answer their queries (`Reqs/dev/Testing#query-cache`).
    # `actions/cache` restores only a cache saved with the same `path`, to
    # that path, so the previous cache is restored where this run's is
    # saved, and moved aside.
    - if: ${{ matrix.shard == 0 }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/query-cache
        key: query-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          query-cache-${{ runner.os }}-${{ runner.arch }}-
    - if: ${{ matrix.shard == 0 }}
      run: |
        if [ -d "$RUNNER_TEMP/query-cache" ]; then
          mv "$RUNNER_TEMP/query-cache" "$RUNNER_TEMP/query-cache-previous"
          echo "FREN_VERIFY_QUERY_CACHE=$RUNNER_TEMP/query-cache-previous" >> "$GITHUB_ENV"
        else
          echo "::notice title=query cache::no previous cache to compare with"
        fi
    - run: lake test -- --timings --shard "$SHARD/5"
      env:
        SHARD: ${{ matrix.shard }}
        FREN_QUERY_CACHE: ${{ runner.temp }}/query-cache
    # Saved whether or not the tests passed, since the answers are the
    # solver's, whatever the checks made of them; but not if one
    # contradicted the previous cache, so that `main` stays red until the
    # key covers what changed (`queryCacheVersion`).
    - if: ${{ matrix.shard == 0 && !cancelled() }}
      id: keep
      run: |
        if [ -e "$RUNNER_TEMP/query-cache.contradicted" ]; then
          echo "::error title=query cache::an answer contradicted the previous cache; not saving this one"
          echo "save=false" >> "$GITHUB_OUTPUT"
        else
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
    - if: ${{ matrix.shard == 0 && !cancelled() && steps.keep.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/query-cache
        key: query-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
  # The book, with the page of the rules that shard 0's test driver writes
  # (`book.yml`).
  book:
    needs: test
    if: ${{ !inputs.fuzz-only && !cancelled() }}
    uses: ./.github/workflows/book.yml
    with:
      artifact: fren_test-${{ github.sha }}
  # The same slow jobs also gate reviewed PR heads (pre-merge.yml).
  slow:
    uses: ./.github/workflows/slow-checks.yml
    with:
      ref: ${{ github.sha }}
      cache-sha: ${{ github.sha }}
      concurrency-key: ${{ github.ref }}
      own-spec-agreement: ${{ !inputs.fuzz-only }}
      methods-agree: ${{ !inputs.fuzz-only }}
      coverage: ${{ !inputs.fuzz-only }}
      fuzz-count: ${{ inputs.fuzz-count || 150 }}
