name: lean ci
# On `main`, everything: `lake build --wfail`, the whole `lake test`, a
# sample of the mutants of Fren's own requirements, and the coverage. It
# saves `main`'s `.lake`, from which each pull request's `pre-merge`
# workflow starts (`Reqs/dev/Testing#continuous-integration`).
on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

# A push to `main` waits for the run before it, rather than cancelling it,
# so that pushes in quick succession still save a `.lake`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      id: lake
      with:
        sha: ${{ github.sha }}
    # `lake build` builds the library, the regression tests (`FrenTest`, which
    # check their own output with `#guard_msgs`), Fren's own requirements
    # (`Reqs`, which `#fren_check` checks with the SMT solver), the links from
    # Fren's code to them (`Impls`, whose `#fren_trace` warns about any
    # requirement without evidence), the example specs' Lean implementations
    # (`Examples`) and the `fren` binary; warnings, including
    # inconclusive checks and untraced requirements, fail it.
    - id: build
      run: lake build --wfail
    # As soon as it is built, for the pull requests that start from it. Lake
    # saves no output of a module that failed, so a failed build's `.lake`
    # would serve as well, but a pull request that restores it would
    # rebuild the modules that failed.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ steps.build.outcome == 'success' && steps.lake.outputs.cache-hit != 'true' }}
      with:
        path: .lake
        key: ${{ steps.lake.outputs.key }}
    # A few mutants of Fren's own requirements on each push, a different few
    # each run (the seed is the run's number), so that over many pushes the
    # runs cover them: all of them, over 3000, are too many for one run.
    # Survivors are warnings, and the step never fails the build, since the
    # survivors are not triaged yet.
    - name: Mutate a few requirements
      continue-on-error: true
      timeout-minutes: 2
      env:
        SEED: ${{ github.run_number }}
      run: |
        set -euo pipefail
        # Fren's own requirements, in the order in which `lake test` checks
        # them (`ownSpecFiles`).
        mapfile -t files < <(sed -n '/^def ownSpecFiles/,/map fun r/p' src/FrenTestMain.lean \
          | grep -o '"[A-Za-z/]*"' | tr -d '"' | sed 's|.*|src/Reqs/&.md|')
        test "${#files[@]}" -gt 0
        if .lake/build/bin/fren mutate --sample 5 --seed "$SEED" --timeout 5 "${files[@]}"; then code=0; else code=$?; fi
        case $code in
          0) ;;
          3) echo "::warning title=fren mutate::some mutants survived (seed $SEED); see the step's log" ;;
          # Shown as an error, and as the step's outcome, though
          # `continue-on-error` keeps the build passing.
          1) echo "::error title=fren mutate::an internal error (seed $SEED); see the step's log"; exit 1 ;;
          *) echo "::error title=fren mutate::could not run (exit $code); see the step's log"; exit "$code" ;;
        esac
  # The whole of `lake test`, the mutants of Fren's own requirements too,
  # split over machines: shard 0 checks Fren's own requirements with the
  # binary, and the others the rest (`Reqs/dev/Testing`).
  test:
    name: lake test (shard ${{ matrix.shard }} of 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake build fren_test
    # Shard 0 asks every query of Fren's own requirements of the solver,
    # with an empty query cache, and compares each answer with the one that
    # the previous `main`'s run kept: a contradiction fails it, and so does
    # comparing no answers, unless the previous cache holds no entry of
    # this `queryCacheVersion` and cvc5, after a change that alters every
    # key. It then saves exactly the answers of this run, from which pull
    # requests answer their queries (`Reqs/dev/Testing#query-cache`).
    # `actions/cache` restores only a cache saved with the same `path`, to
    # that path, so the previous cache is restored where this run's is
    # saved, and moved aside.
    - if: ${{ matrix.shard == 0 }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/query-cache
        key: query-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          query-cache-${{ runner.os }}-${{ runner.arch }}-
    - if: ${{ matrix.shard == 0 }}
      run: |
        if [ -d "$RUNNER_TEMP/query-cache" ]; then
          mv "$RUNNER_TEMP/query-cache" "$RUNNER_TEMP/query-cache-previous"
          echo "FREN_VERIFY_QUERY_CACHE=$RUNNER_TEMP/query-cache-previous" >> "$GITHUB_ENV"
        else
          echo "::notice title=query cache::no previous cache to compare with"
        fi
    - run: lake test -- --timings --shard "$SHARD/5"
      env:
        SHARD: ${{ matrix.shard }}
        FREN_QUERY_CACHE: ${{ runner.temp }}/query-cache
    # Saved whether or not the tests passed, since the answers are the
    # solver's, whatever the checks made of them; but not if one
    # contradicted the previous cache, so that `main` stays red until the
    # key covers what changed (`queryCacheVersion`).
    - if: ${{ matrix.shard == 0 && !cancelled() }}
      id: keep
      run: |
        if [ -e "$RUNNER_TEMP/query-cache.contradicted" ]; then
          echo "::error title=query cache::an answer contradicted the previous cache; not saving this one"
          echo "save=false" >> "$GITHUB_OUTPUT"
        else
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
    - if: ${{ matrix.shard == 0 && !cancelled() && steps.keep.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/query-cache
        key: query-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
  # The front-end fuzzer on seeds that no run used before, from the run's
  # number, with `--avoid-known`: a difference of a kind that
  # `knownDifferences` does not list for `--avoid-known`, a crash or a
  # timeout fails it, and the specs that it found are uploaded, to be
  # fixed or filed and listed (`Reqs/dev/Testing#continuous-integration`).
  # The kinds listed for `--avoid-known` go unchecked here, with either
  # generator: today Lean's extra `F0743` (#493). `lake test` checks the
  # fixed corpus on every pull request.
  fuzz-frontends:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake build fren_fuzz_frontends
    # Four fuzzers at once, one to a core, two of each generator, each on
    # 150 seeds of the run's 1000, far from the corpus's.
    - name: Fuzz the front ends
      env:
        RUN: ${{ github.run_number }}
      run: |
        set -euo pipefail
        base=$((1000000 + RUN * 1000))
        fuzz() { lake env .lake/build/bin/fren_fuzz_frontends --avoid-known --out fuzz "$@"; }
        fuzz --count 150 --seed "$base" & a=$!
        fuzz --count 150 --seed "$((base + 150))" & b=$!
        fuzz --guards --count 150 --seed "$((base + 300))" & c=$!
        fuzz --guards --count 150 --seed "$((base + 450))" & d=$!
        code=0
        for pid in "$a" "$b" "$c" "$d"; do wait "$pid" || code=1; done
        exit "$code"
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-frontends-${{ github.run_number }}
        path: fuzz
        if-no-files-found: ignore
        retention-days: 30
  # Every declaration of Fren's code is run by `lake test`, or listed in
  # `test/coverage.txt` (`Reqs/dev/Testing#coverage`).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    # Lean's toolchain has clang but not its profiling runtime: LLVM's, of
    # the same major version, and its `llvm-cov`.
    - name: Install the profiling runtime and llvm-cov
      run: |
        set -euo pipefail
        version=$("$(dirname "$(elan which lean)")/clang" --version | sed -n 's/^clang version \([0-9]*\).*/\1/p')
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
        # The key of apt.llvm.org, by its fingerprint, and no other: `gpg
        # --dearmor` trusts every key in the file. Each primary key's `pub`
        # record is followed by its `fpr`; a subkey's follows its `sub`.
        test "$(gpg --show-keys --with-colons llvm.asc \
            | awk -F: '$1 == "pub" { primary = 1 } $1 == "fpr" && primary { print $10; primary = 0 }')" \
          = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg llvm.asc
        printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-%s main\n' "$version" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y "libclang-rt-$version-dev" "llvm-$version"
        runtime=$(find "/usr/lib/llvm-$version" -name 'libclang_rt.profile*.a' | grep -E 'x86_64|linux/libclang_rt.profile.a' | head -n 1)
        printf 'COVERAGE_RUNTIME=%s\nLLVM_COV=%s\n' "$runtime" "/usr/lib/llvm-$version/bin/llvm-cov" >> "$GITHUB_ENV"
    - name: Build with coverage
      run: lake -R -Kcoverage="$COVERAGE_RUNTIME" build fren fren_test fren_coverage
    - name: Run the tests
      run: lake -Kcoverage="$COVERAGE_RUNTIME" test
    - name: Report what the tests did not run
      run: lake exe fren_coverage "$LLVM_COV" gcov
