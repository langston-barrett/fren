name: lean ci
# On `main`, everything: `lake build --wfail`, the whole `lake test`, a
# sample of the mutants of Fren's own requirements, their checks in Lean,
# compared with the binary's, the coverage, and the book, with the test
# driver that shard 0 uploads as `fren_test-SHA` (`book.yml`). It
# saves `main`'s `.lake`, from which each pull request's `pre-merge`
# workflow starts (`Reqs/dev/Testing#continuous-integration`).
on:
  push:
    branches:
    - main
  # A run by hand, on any branch, may fuzz alone, and more seeds, to try a
  # change to the fuzzer or to its known kinds.
  workflow_dispatch:
    inputs:
      fuzz-only:
        description: Run only the fuzz-frontends job
        type: boolean
        default: false
      fuzz-count:
        description: Seeds for each of fuzz-frontends' four fuzzers
        type: number
        default: 150

permissions:
  contents: read

# Each job of a push to `main` waits for the same job of the run before it,
# rather than cancelling it: of pushes in quick succession, none cancels a
# running job and the latest saves a `.lake`, though GitHub cancels a job
# that is still pending when a later one of its group is queued, so that a
# run in between may be cancelled, in part or whole. So shard 0 still
# compares with the query cache that the previous shard 0 saved. No job
# waits for the whole run before it, so the build job saves the `.lake`
# from which pull requests start as soon as it has built, rather than once
# the slowest job of the run before it has finished
# (`Reqs/dev/Testing#continuous-integration`).
jobs:
  build:
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      id: lake
      with:
        sha: ${{ github.sha }}
    # `lake build` builds the library, the regression tests (`FrenTest`, which
    # check their own output with `#guard_msgs`), Fren's own requirements
    # (`Reqs`, only elaborated: `lake test`'s `ownSpec` checks them with the
    # binary, and the `own-spec-agreement` job below in Lean), the links from
    # Fren's code to them (`Impls`, whose `#fren_trace` warns about any
    # requirement without evidence), the example specs' Lean implementations
    # (`Examples`) and the `fren` binary; warnings, including
    # inconclusive checks and untraced requirements, fail it.
    - id: build
      run: touch "$RUNNER_TEMP/build-start" && lake build --wfail
    # As soon as it is built, for the pull requests that start from it. Lake
    # saves no output of a module that failed, so a failed build's `.lake`
    # would serve as well, but a pull request that restores it would
    # rebuild the modules that failed.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ steps.build.outcome == 'success' && steps.lake.outputs.cache-hit != 'true' }}
      with:
        path: .lake
        key: ${{ steps.lake.outputs.key }}
    # No output that the build wrote names the checkout's directory, as in
    # `pre-merge` (`Reqs/dev/Testing#shared-builds`).
    - run: python3 scripts/relocatable.py --since "$RUNNER_TEMP/build-start"
    # A few mutants of Fren's own requirements on each push, a different few
    # each run (the seed is the run's number), so that over many pushes the
    # runs cover them: all of them, over 3000, are too many for one run.
    # Survivors are warnings, and the step never fails the build, since the
    # survivors are not triaged yet.
    - name: Mutate a few requirements
      continue-on-error: true
      timeout-minutes: 2
      env:
        SEED: ${{ github.run_number }}
      run: |
        set -euo pipefail
        # Fren's own requirements, in the order in which `lake test` checks
        # them (`ownSpecFiles`).
        mapfile -t files < <(sed -n '/^def ownSpecFiles/,/map fun r/p' src/FrenTestMain.lean \
          | grep -o '"[A-Za-z/]*"' | tr -d '"' | sed 's|.*|src/Reqs/&.md|')
        test "${#files[@]}" -gt 0
        if .lake/build/bin/fren mutate --sample 5 --seed "$SEED" --timeout 5 "${files[@]}"; then code=0; else code=$?; fi
        case $code in
          0) ;;
          3) echo "::warning title=fren mutate::some mutants survived (seed $SEED); see the step's log" ;;
          # Shown as an error, and as the step's outcome, though
          # `continue-on-error` keeps the build passing.
          1) echo "::error title=fren mutate::an internal error (seed $SEED); see the step's log"; exit 1 ;;
          *) echo "::error title=fren mutate::could not run (exit $code); see the step's log"; exit "$code" ;;
        esac
  # The whole of `lake test`, the mutants of Fren's own requirements too,
  # split over machines: shard 0 checks Fren's own requirements with the
  # binary, and the others the rest (`Reqs/dev/Testing`).
  test:
    name: lake test (shard ${{ matrix.shard }} of 5)
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake build fren_test
    # The test driver, stripped, from which `book` writes the page of the
    # rules (`book.yml`).
    - if: ${{ matrix.shard == 0 }}
      run: |
        mkdir "$RUNNER_TEMP/artifact"
        cp .lake/build/bin/fren_test "$RUNNER_TEMP/artifact/fren_test"
        # Lake's artifact cache links its outputs read-only, so the copy is
        # too (`Reqs/dev/Testing#shared-builds`).
        chmod u+w "$RUNNER_TEMP/artifact/fren_test"
        strip "$RUNNER_TEMP/artifact/fren_test"
    - if: ${{ matrix.shard == 0 }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fren_test-${{ github.sha }}
        path: ${{ runner.temp }}/artifact
        if-no-files-found: error
        retention-days: 3
        overwrite: true
    # Shard 0 asks every query of Fren's own requirements of the solver,
    # with an empty query cache, and compares each answer with the one that
    # the previous `main`'s run kept: a contradiction fails it, and so does
    # comparing no answers, unless the previous cache has no entry of this
    # `queryCacheVersion` and cvc5 (as after a change that alters every
    # key). It then saves exactly the answers of this run, from which pull
    # requests answer their queries (`Reqs/dev/Testing#query-cache`).
    # `actions/cache` restores only a cache saved with the same `path`, to
    # that path, so the previous cache is restored where this run's is
    # saved, and moved aside.
    - if: ${{ matrix.shard == 0 }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/query-cache
        key: query-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          query-cache-${{ runner.os }}-${{ runner.arch }}-
    - if: ${{ matrix.shard == 0 }}
      run: |
        if [ -d "$RUNNER_TEMP/query-cache" ]; then
          mv "$RUNNER_TEMP/query-cache" "$RUNNER_TEMP/query-cache-previous"
          echo "FREN_VERIFY_QUERY_CACHE=$RUNNER_TEMP/query-cache-previous" >> "$GITHUB_ENV"
        else
          echo "::notice title=query cache::no previous cache to compare with"
        fi
    - run: lake test -- --timings --shard "$SHARD/5"
      env:
        SHARD: ${{ matrix.shard }}
        FREN_QUERY_CACHE: ${{ runner.temp }}/query-cache
    # Saved whether or not the tests passed, since the answers are the
    # solver's, whatever the checks made of them; but not if one
    # contradicted the previous cache, so that `main` stays red until the
    # key covers what changed (`queryCacheVersion`).
    - if: ${{ matrix.shard == 0 && !cancelled() }}
      id: keep
      run: |
        if [ -e "$RUNNER_TEMP/query-cache.contradicted" ]; then
          echo "::error title=query cache::an answer contradicted the previous cache; not saving this one"
          echo "save=false" >> "$GITHUB_OUTPUT"
        else
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
    - if: ${{ matrix.shard == 0 && !cancelled() && steps.keep.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/query-cache
        key: query-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
  # The book, with the page of the rules that shard 0's test driver writes
  # (`book.yml`).
  book:
    needs: test
    if: ${{ !inputs.fuzz-only && !cancelled() }}
    uses: ./.github/workflows/book.yml
    with:
      artifact: fren_test-${{ github.sha }}
  # Fren's own requirements checked in Lean, which `lake build` only
  # elaborates: built with their checks (`-Kcheck_reqs`), where a failing or
  # inconclusive check fails `--wfail`, and Lean's messages compared with
  # the binary's (`Reqs/dev/Testing#own-requirements`). It saves no `.lake`:
  # pull requests start from the build job's, without the checks.
  own-spec-agreement:
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-own-spec-agreement-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake -R -Kcheck_reqs=1 build --wfail Reqs
    - run: lake -R -Kcheck_reqs=1 build fren_test
    # With an empty query cache, so that the binary asks the solver too.
    - run: |
        set -euo pipefail
        out=$(lake env .lake/build/bin/fren_test --job ownSpecAgreement)
        echo "$out"
        test "$out" = "[]"
      env:
        FREN_QUERY_CACHE: ""
  # The front-end fuzzer on seeds that no run used before, from the run's
  # number, with `--avoid-known` (`Reqs/dev/Testing#continuous-integration`).
  # Each difference is classified by its kind (`signature`). A kind is
  # known if `knownDifferences` lists it for `--avoid-known`, or
  # `knownKinds` lists it, each with the issue that tracks it, under the
  # conditions that the entry states (after a static error, or alongside
  # another kind). What fails the job is exactly this: a spec with a
  # difference of a kind that is not known, a crash, or a timeout. A spec
  # whose differences are all of known kinds, or only in inconclusive
  # results, does not fail it. The job's summary lists every failure with
  # its kinds, and every known kind found, with its issue and seeds; the
  # specs are uploaded as the artifact `fuzz-frontends-RUN`, those of known
  # kinds as `known-fe-seedN.fren`. A new kind is fixed, or recorded on its
  # issue and listed in `knownKinds`; CI posts to no issue. `lake test`
  # checks the fixed corpus on every pull request.
  fuzz-frontends:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-fuzz-frontends-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake build fren_fuzz_frontends
    # Four fuzzers at once, one to a core, two of each generator, each on
    # 150 seeds of the run's 1000, far from the corpus's (a run by hand may
    # ask for more, which reach into later runs' seeds). Each exits nonzero
    # on a failure, as above.
    - name: Fuzz the front ends
      env:
        RUN: ${{ github.run_number }}
        COUNT: ${{ inputs.fuzz-count || 150 }}
      run: |
        set -euo pipefail
        base=$((1000000 + RUN * 1000))
        fuzz() { lake env .lake/build/bin/fren_fuzz_frontends --avoid-known --out fuzz "$@"; }
        fuzz --count "$COUNT" --seed "$base" & a=$!
        fuzz --count "$COUNT" --seed "$((base + COUNT))" & b=$!
        fuzz --guards --count "$COUNT" --seed "$((base + 2 * COUNT))" & c=$!
        fuzz --guards --count "$COUNT" --seed "$((base + 3 * COUNT))" & d=$!
        code=0
        for pid in "$a" "$b" "$c" "$d"; do wait "$pid" || code=1; done
        exit "$code"
    - name: Report the findings
      if: ${{ !cancelled() && hashFiles('fuzz/results-*.jsonl') != '' }}
      env:
        RUN: ${{ github.run_number }}
      run: |
        set -euo pipefail
        {
          echo "### Front-end fuzzer"
          echo
          echo "The specs are in the artifact \`fuzz-frontends-$RUN\`."
          echo
          lake env .lake/build/bin/fren_fuzz_frontends --report fuzz
        } >> "$GITHUB_STEP_SUMMARY"
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-frontends-${{ github.run_number }}
        path: fuzz
        if-no-files-found: ignore
        retention-days: 30
  # Every check of Fren's own requirements, the ui tests and the front-end
  # fuzzer's corpus, under the solver, enumeration and random testing, each
  # set by `fren check --evidence`; it fails where two methods' verdicts on
  # a check contradict each other (`check::methods_agree`,
  # `Reqs/Methods#agreement-of-methods`).
  methods-agree:
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-methods-agree-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    - run: lake build fren_test
    - run: |
        set -euo pipefail
        part() {
          local name="${*// /-}"
          local status=0
          lake env .lake/build/bin/fren_test --job methodsAgree "$@" > "$RUNNER_TEMP/methods-$name.out" || status=$?
          # A part that crashes prints no summary, so say how it ended: by
          # its exit status, or the signal that killed it.
          if [ "$status" -ne 0 ]; then
            local how="exit status $status"
            if [ "$status" -gt 128 ]; then how="$how, signal SIG$(kill -l $((status - 128)))"; fi
            echo "::error::methodsAgree $* ended with $how"
            return 1
          fi
        }
        # One part at a time: on macOS, `own` (two procedures at once) took
        # 9.4 GB and `ui` (as many as there are cores, 14 there) 8.8 GB.
        code=0
        part own || code=1
        part ui 0 1 || code=1
        part fuzz || code=1
        for f in "$RUNNER_TEMP"/methods-*.out; do
          cat "$f"
          test "$(tail -n 1 "$f")" = "[]" || code=1
        done
        exit "$code"
  # Every declaration of Fren's code is run by `lake test`, or listed in
  # `test/coverage.txt` (`Reqs/dev/Testing#coverage`).
  coverage:
    if: ${{ !inputs.fuzz-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-coverage-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/lake
      with:
        sha: ${{ github.sha }}
    # Lean's toolchain has clang but not its profiling runtime: LLVM's, of
    # the same major version, and its `llvm-cov`.
    - name: Install the profiling runtime and llvm-cov
      run: |
        set -euo pipefail
        version=$("$(dirname "$(elan which lean)")/clang" --version | sed -n 's/^clang version \([0-9]*\).*/\1/p')
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
        # The key of apt.llvm.org, by its fingerprint, and no other: `gpg
        # --dearmor` trusts every key in the file. Each primary key's `pub`
        # record is followed by its `fpr`; a subkey's follows its `sub`.
        test "$(gpg --show-keys --with-colons llvm.asc \
            | awk -F: '$1 == "pub" { primary = 1 } $1 == "fpr" && primary { print $10; primary = 0 }')" \
          = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg llvm.asc
        printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-%s main\n' "$version" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y "libclang-rt-$version-dev" "llvm-$version"
        runtime=$(find "/usr/lib/llvm-$version" -name 'libclang_rt.profile*.a' | grep -E 'x86_64|linux/libclang_rt.profile.a' | head -n 1)
        printf 'COVERAGE_RUNTIME=%s\nLLVM_COV=%s\n' "$runtime" "/usr/lib/llvm-$version/bin/llvm-cov" >> "$GITHUB_ENV"
    - name: Build with coverage
      # The `.olean` files of every executable's root, which `fren_coverage`
      # reads to follow each one's compiled code, too.
      run: lake -R -Kcoverage="$COVERAGE_RUNTIME" build fren fren_test fren_coverage FrenFuzz FrenFuzzFrontends
    - name: Run the tests
      run: lake -Kcoverage="$COVERAGE_RUNTIME" test
    - name: Report what the tests did not run
      run: lake exe fren_coverage "$LLVM_COV" gcov
