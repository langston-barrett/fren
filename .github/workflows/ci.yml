name: lean ci
# Not on pull requests, to save Actions minutes: before a PR is merged, its
# author runs `lake build --wfail` and `lake test` locally, and anyone can
# still run this on a PR's branch by hand (workflow_dispatch).
on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The dependencies (cvc5, lean-smt, ...) depend only on the toolchain and
    # the manifest. `lean-action` saves `.lake` only when the build succeeds,
    # and a warning fails it, so they are cached apart, whatever the outcome.
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: packages
      with:
        path: .lake/packages
        key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
    # The dependencies first, without `--wfail`: one that builds from source
    # warns that it couldn't fetch a release, and `--wfail` would count that
    # warning as a failure of Fren's build.
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      with:
        build-args: +Smt +cvc5
        test: false
        lint: false
        use-github-cache: false
    # `lake build` builds the library, the regression tests (`FrenTest`, which
    # check their own output with `#guard_msgs`), Fren's own requirements
    # (`Reqs`, which `#fren_check` checks with the SMT solver), the links from
    # Fren's code to them (`Impls`, whose `#fren_trace` warns about any
    # requirement without evidence) and the `fren` binary; warnings, including
    # inconclusive checks and untraced requirements, fail it. `lake test` runs
    # the ui, snapshot and agreement tests.
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      with:
        build-args: --wfail
        test: true
        lint: false
    # A few mutants of Fren's own requirements on each push, a different few
    # each run (the seed is the run's number), so that over many pushes the
    # runs cover them: all of them, over 3000, are too many for one run.
    # Survivors are warnings, and the step never fails the build, since the
    # survivors are not triaged yet.
    - name: Mutate a few requirements
      continue-on-error: true
      timeout-minutes: 2
      env:
        SEED: ${{ github.run_number }}
      run: |
        set -euo pipefail
        # Fren's own requirements, in the order in which `lake test` checks
        # them (`ownSpecFiles`).
        mapfile -t files < <(sed -n '/^def ownSpecFiles/,/map fun r/p' src/FrenTestMain.lean \
          | grep -o '"[A-Za-z/]*"' | tr -d '"' | sed 's|.*|src/Reqs/&.md|')
        test "${#files[@]}" -gt 0
        if .lake/build/bin/fren mutate --sample 5 --seed "$SEED" --timeout 5 "${files[@]}"; then code=0; else code=$?; fi
        case $code in
          0) ;;
          3) echo "::warning title=fren mutate::some mutants survived (seed $SEED); see the step's log" ;;
          *) echo "::error title=fren mutate::exited with $code"; exit "$code" ;;
        esac
    # Only once the packages Fren imports, `Smt` and `cvc5`, are built (and so
    # everything they import): a fetch or a dependency build that failed
    # partway must not be saved, as the exact key would keep it.
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: >-
        ${{ !cancelled() && steps.packages.outputs.cache-hit != 'true' &&
            hashFiles('.lake/packages/cvc5/.lake/build/lib/lean/cvc5.olean') != '' &&
            hashFiles('.lake/packages/smt/.lake/build/lib/lean/Smt.olean') != '' }}
      with:
        path: .lake/packages
        key: ${{ steps.packages.outputs.cache-primary-key }}
  # Every declaration of Fren's code is run by `lake test`, or listed in
  # `test/coverage.txt` (`Reqs/dev/Testing#coverage`).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .lake/packages
        key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      with:
        build-args: +Smt +cvc5
        test: false
        lint: false
        use-github-cache: false
    # Lean's toolchain has clang but not its profiling runtime: LLVM's, of
    # the same major version, and its `llvm-cov`.
    - name: Install the profiling runtime and llvm-cov
      run: |
        set -euo pipefail
        version=$("$(dirname "$(elan which lean)")/clang" --version | sed -n 's/^clang version \([0-9]*\).*/\1/p')
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
        # The key of apt.llvm.org, by its fingerprint, and no other: `gpg
        # --dearmor` trusts every key in the file. Each primary key's `pub`
        # record is followed by its `fpr`; a subkey's follows its `sub`.
        test "$(gpg --show-keys --with-colons llvm.asc \
            | awk -F: '$1 == "pub" { primary = 1 } $1 == "fpr" && primary { print $10; primary = 0 }')" \
          = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg llvm.asc
        printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-%s main\n' "$version" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y "libclang-rt-$version-dev" "llvm-$version"
        runtime=$(find "/usr/lib/llvm-$version" -name 'libclang_rt.profile*.a' | grep -E 'x86_64|linux/libclang_rt.profile.a' | head -n 1)
        printf 'COVERAGE_RUNTIME=%s\nLLVM_COV=%s\n' "$runtime" "/usr/lib/llvm-$version/bin/llvm-cov" >> "$GITHUB_ENV"
    - name: Build with coverage
      run: lake -R -Kcoverage="$COVERAGE_RUNTIME" build fren fren_test fren_coverage
    - name: Run the tests
      run: lake -Kcoverage="$COVERAGE_RUNTIME" test
    - name: Report what the tests did not run
      run: lake exe fren_coverage "$LLVM_COV" gcov
