name: lean ci
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The dependencies (cvc5, lean-smt, ...) depend only on the toolchain and
    # the manifest. `lean-action` saves `.lake` only when the build succeeds,
    # and a warning fails it, so they are cached apart, whatever the outcome.
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: packages
      with:
        path: .lake/packages
        key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
    # `lake build` builds the library, the regression tests (`FrenTest`, which
    # check their own output with `#guard_msgs`), Fren's own requirements
    # (`Reqs`, which `#fren_check` checks with the SMT solver), the links from
    # Fren's code to them (`Impls`, whose `#fren_trace` warns about any
    # requirement without evidence) and the `fren` binary; warnings, including
    # inconclusive checks and untraced requirements, fail it. `lake test` runs
    # the ui, snapshot and agreement tests.
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      with:
        build-args: --wfail
        test: true
        lint: false
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: ${{ !cancelled() && steps.packages.outputs.cache-hit != 'true' }}
      with:
        path: .lake/packages
        key: ${{ steps.packages.outputs.cache-primary-key }}
