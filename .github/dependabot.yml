version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # See https://docs.zizmor.sh/audits/#dependabot-cooldown
    cooldown:
      # The 4 days set before lint ran zizmor, which asks for 7; whether to
      # raise them is a decision apart from pr-review.
      default-days: 4 # zizmor: ignore[dependabot-cooldown]
