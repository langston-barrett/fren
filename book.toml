# Fren's reference manual: the requirements in `src/Reqs`, which are also
# checked by `lake build`. `mdbook build` writes it to `book/`.
[book]
title = "Fren"
src = "src/Reqs"

[build]
build-dir = "book"

# Renders rule identifiers, `r[...]` lines (`dev/Style.md`), as anchors.
# Installing it is described in `dev/Overview.md`.
[preprocessor.spec]
command = "mdbook-spec"
