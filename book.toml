# Fren's reference manual: the requirements in `src/Reqs`, which `lake
# build` elaborates, `fren check` checks in `lake test`, and Lean checks on
# `main`. `mdbook build` writes it to `book/`.
[book]
title = "Fren"
src = "src/Reqs"

[build]
build-dir = "book"

# Renders rule identifiers, `r[...]` lines (`dev/Style.md`), as anchors.
# Installing it is described in `dev/Overview.md`.
[preprocessor.spec]
command = "mdbook-spec"

# Adds the page `dev/Rules.md`, the report of the rules and their
# requirements, which `fren_test --rules-report` writes
# (`scripts/rules_report.py`): build the test driver, `lake build fren_test`,
# before the book.
[preprocessor.rules]
command = "python3 scripts/rules_report.py"
before = ["spec"]
