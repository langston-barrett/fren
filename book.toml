# Fren's reference manual: the requirements in `src/Reqs`, which `lake
# build` elaborates, `fren check` checks in `lake test`, and Lean checks on
# `main`. `mdbook build` writes it to `book/`.
[book]
title = "Fren"
src = "."

[build]
build-dir = "book"

# Renders rule identifiers, `r[...]` lines (`dev/Style.md`), as anchors.
# Installing it is described in `dev/Overview.md`.
[preprocessor.spec]
command = "mdbook-spec"

# Adds the page `dev/Rules.md`, the report of the rules and their
# requirements, which `fren_test --rules-report` writes
# (`scripts/rules_report.py`): build the test driver, `lake build fren_test`,
# before the book, or the page is a placeholder. Renders the links of each
# rule's identifier line, `r[ID] LINKS`, before mdbook-spec, which reads only
# `r[ID]`.
[preprocessor.rules]
# The preprocessor's paths are relative to the book source. The reference
# now lives under src/Reqs within that source.
command = """python3 -c 'import scripts.rules_report as r; r.PARENT="src/Reqs/dev/Style.md"; r.PATH="src/Reqs/dev/Rules.md"; r.main()'"""
before = ["spec"]
