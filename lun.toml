refs = ["origin/main"]

# Lean code is checked by `lake build --wfail` in the `lean ci` workflow.

[[tool]]
name = "mdlynx"

[[tool]]
name = "ttlint"

[[tool]]
name = "typos"
configs = []

# lun's default for zizmor, `.github/**/*.yml`, matches no file, so zizmor
# never ran. Every YAML file of the repository is GitHub's, except zizmor's
# own configuration, which zizmor does not find by itself when it is given
# files, so it is passed. Lint runs zizmor without a GitHub token, so
# offline: its online audits, such as `impostor-commit`, `ref-confusion`
# and `known-vulnerable-actions`, don't run.
[[tool]]
name = "zizmor"
cmd = "zizmor --config zizmor.yml --"
configs = ["zizmor.yml"]
files = ["*.yml"]
ignore = ["zizmor.yml"]

[[formatter]]
name = "keep-sorted"
cmd = "keep-sorted --mode fix --"
files = ["*.lean", "*.md"]
check = "keep-sorted --mode lint --"
